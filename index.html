                            <span className="text-slate-600">Alat Utama (3 Kursi Barber Hidrolik)</span>
                            <span className="font-bold text-slate-800">Rp 6.000.000</span>
                          </li>
                          <li className="flex justify-between border-b border-slate-100 pb-2">
                            <span className="text-slate-600">Alat Cukur Prof. (Clipper, Trimmer)</span>
                            <span className="font-bold text-slate-800">Rp 4.500.000</span>
                          </li>
                          <li className="flex justify-between border-b border-slate-100 pb-2">
                            <span className="text-slate-600">Admin & Modul Pembelajaran</span>
                            <span className="font-bold text-slate-800">Rp 1.500.000</span>
                          </li>
                        </ul>
                        <div className="mt-auto bg-slate-50 p-3 rounded-lg flex justify-between items-center border border-slate-200">
                          <span className="font-bold text-slate-500 text-xs">TOTAL MODAL AWAL</span>
                          <span className="font-black text-slate-900 text-lg">Rp 29.000.000</span>
                        </div>
                      </div>
                    </div>

                    {/* OpEx Card */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                      <div className="bg-slate-800 p-4 text-white">
                        <h3 className="font-bold text-lg">OpEx (Biaya Bulanan)</h3>
                        <p className="text-slate-400 text-xs">Operasional Berjalan + Program Sosial</p>
                      </div>
                      <div className="p-5 flex-1">
                        <ul className="text-sm space-y-3 mb-6">
                          <li className="flex justify-between border-b border-slate-100 pb-2">
                            <span className="text-slate-600">Listrik, Air & WiFi</span>
                            <span className="font-bold text-slate-800">Rp 500.000</span>
                          </li>
                          <li className="flex justify-between border-b border-slate-100 pb-2">
                            <span className="text-slate-600">Bahan Habis Pakai (Silet, Bedak)</span>
                            <span className="font-bold text-slate-800">Rp 500.000</span>
                          </li>
                          <li className="flex justify-between border-b border-slate-100 pb-2">
                            <span className="text-slate-600">Bagi Hasil Mentor Barber (2 org)</span>
                            <span className="font-bold text-slate-800">Rp 3.000.000</span>
                          </li>
                          <li className="flex justify-between border-b border-slate-100 pb-2">
                            <span className="text-amber-600 font-semibold text-xs bg-amber-50 px-2 py-0.5 rounded">Program Sosial:</span>
                          </li>
                          <li className="flex justify-between border-b border-slate-100 pb-2">
                            <span className="text-slate-600">Uang Saku Magang (2 Santri)</span>
                            <span className="font-bold text-slate-800">Rp 1.000.000</span>
                          </li>
                        </ul>
                        <div className="mt-auto bg-slate-50 p-3 rounded-lg flex justify-between items-center border border-slate-200">
                          <span className="font-bold text-slate-500 text-xs">TOTAL OPEX / BULAN</span>
                          <span className="font-black text-slate-900 text-lg">Rp 5.000.000</span>
                        </div>
                      </div>
                    </div>

                    {/* Revenue & Margin Card */}
                    <div className="bg-gradient-to-br from-amber-500 to-amber-600 rounded-2xl shadow-md overflow-hidden flex flex-col text-slate-900 border border-amber-600">
                  <div className="p-4 bg-white/20 backdrop-blur-sm border-b border-white/20">
                    <h3 className="font-bold text-lg text-slate-900">Proyeksi Pendapatan Mandiri</h3>
                    <p className="text-amber-900/80 text-xs font-semibold">Kapasitas: 20 pelanggan/hari @ Rp15.000</p>
                  </div>
                  <div className="p-5 flex-1 text-slate-900">
                    <div className="mb-6">
                      <div className="text-xs font-bold uppercase tracking-wider mb-1 opacity-80">Estimasi Omzet / Bulan</div>
                      <div className="text-3xl font-black mb-1">Rp 9.000.000</div>
                      <div className="text-xs opacity-90 border-b border-slate-900/10 pb-4">
                        (20 org/hari x Rp15.000 x 30 hari operasional)
                      </div>
                    </div>
                    
                    <div className="mb-6">
                      <div className="text-xs font-bold uppercase tracking-wider mb-1 opacity-80">Laba Bersih / Bulan</div>
                      <div className="text-2xl font-black mb-1">Rp 4.000.000</div>
                      <div className="text-xs opacity-90 italic">
                        (Omzet - Seluruh OpEx)
                      </div>
                    </div>

                    <div className="bg-white/90 rounded-xl p-4 mt-auto">
                      <h4 className="text-xs font-bold uppercase text-slate-800 mb-2">Alokasi Surplus Laba:</h4>
                      <div className="flex gap-2 text-sm font-semibold">
                        <div className="flex-1 bg-slate-100 p-2 rounded text-center text-slate-700">
                          <div className="text-[11px] text-slate-500 mb-1">60% Ekspansi Banten</div>
                          Rp 2.4 Jt
                        </div>
                        <div className="flex-1 bg-amber-100 p-2 rounded text-center text-amber-800 border border-amber-200">
                          <div className="text-[11px] text-amber-600 mb-1">40% Subsidi Santri</div>
                          Rp 1.6 Jt
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 6: PITCH SCRIPT 3 MENIT */}
          {activeTab === 'script' && (
            <div className="max-w-4xl mx-auto space-y-6 animate-fadeIn">
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 p-6 flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Naskah Pitching (3 Menit)</h2>
                    <p className="text-amber-400 text-sm mt-1">Struktur STAR: Banten Regional Scope - Dewan Juri Wirasena Kemenpora</p>
                  </div>
                  <div className="hidden sm:flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                    <span className="text-slate-300 text-xs font-mono font-bold">03:00 MENIT</span>
                  </div>
                </div>
                
                <div className="p-6 md:p-8 space-y-8">
                  
                  {/* Menit 1 */}
                  <div className="relative pl-8 border-l-2 border-slate-200">
                    <div className="absolute w-8 h-8 bg-slate-900 text-white font-bold rounded-full flex items-center justify-center -left-[17px] top-0 text-sm">1</div>
                    <h3 className="text-lg font-bold text-slate-800 mb-2">Menit 1: Masalah Riil Provinsi Banten (The Hook & Urgency)</h3>
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-slate-700 leading-relaxed italic relative">
                      <span className="absolute text-6xl text-slate-200 -top-4 -left-2 font-serif opacity-50">"</span>
                      Selamat pagi Dewan Juri Wirasena 2026 yang terhormat. Saya Muh. Armil Syam, delegasi dari Provinsi Banten.<br/><br/>
                      Banten dikenal sebagai Tanah Jawara dan Kota Sejuta Santri dengan lebih dari 4.000 pondok pesantren. Namun, di balik potensi itu, Banten mencatat kenyataan memprihatinkan: <strong>Tingkat Pengangguran Terbuka (TPT) Banten mencapai 7,02%, secara konsisten masuk jajaran tertinggi di Indonesia.</strong><br/><br/>
                      Ribuan santri salafi di pelosok desa dan anak-anak yang putus sekolah akibat himpitan ekonomi tidak memiliki keahlian vokasi siap kerja. Apakah kita akan membiarkan pemuda Banten terus menjadi penonton di tanah kelahirannya sendiri? Solusi yang saya bawa adalah sebuah gerakan wirausaha sosial terukur: <strong>Jawara Barber Academy.</strong>
                    </div>
                  </div>

                  {/* Menit 2 */}
                  <div className="relative pl-8 border-l-2 border-slate-200">
                    <div className="absolute w-8 h-8 bg-amber-500 text-slate-900 font-bold rounded-full flex items-center justify-center -left-[17px] top-0 text-sm">2</div>
                    <h3 className="text-lg font-bold text-slate-800 mb-2">Menit 2: Solusi, Inovasi & Model Ekonomi Sirkular (The Method)</h3>
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-slate-700 leading-relaxed italic relative">
                      <span className="absolute text-6xl text-slate-200 -top-4 -left-2 font-serif opacity-50">"</span>
                      Jawara Barber Academy adalah inkubator keterampilan pangkas rambut gratis yang membina santri dan pemuda putus sekolah di Banten menjadi wirausahawan mandiri.<br/><br/>
                      Industri pangkas rambut adalah bisnis anti-resesi. Pria potong rambut setiap bulan. Dengan tarif terjangkau Rp15.000, 1 outlet menghasilkan omzet Rp9.000.000 per bulan. <strong>Keunggulan inovasi kami: 40% laba bersih dialokasikan langsung untuk mensubsidi penuh pelatihan siswa angkatan berikutnya,</strong> ditambah program magang berbayar dan pembagian 'Paket Barber Mandiri'. Pelanggan yang datang mencukur otomatis menjadi donatur masa depan pemuda Banten.
                    </div>
                  </div>

                  {/* Menit 3 */}
                  <div className="relative pl-8 border-l-2 border-transparent">
                    <div className="absolute w-8 h-8 bg-emerald-500 text-white font-bold rounded-full flex items-center justify-center -left-[17px] top-0 text-sm">3</div>
                    <h3 className="text-lg font-bold text-slate-800 mb-2">Menit 3: Peta Jalan, Dampak Terukur & Penutup (The Scale & Vision)</h3>
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-slate-700 leading-relaxed italic relative">
                      <span className="absolute text-6xl text-slate-200 -top-4 -left-2 font-serif opacity-50">"</span>
                      Melalui Peta Jalan 2026–2030, kami mulai dari hub percontohan di Pandeglang, lalu mereplikasi ke Lebak, Serang, hingga Tangerang Raya. Target kami jelas: <strong>mengentaskan minimal 500 pemuda dari pengangguran, menginisiasi Koperasi Santri Barber Banten, dan rutin menggelar ekspedisi 'Cukur Berbagi' ke pondok pesantren salafi terpencil.</strong><br/><br/>
                      Kami tidak sekadar memotong rambut; <strong>kami sedang memotong mata rantai kemiskinan antargenerasi di Tanah Jawara.</strong> Bersama Kemenpora Wirasena 2026, mari kita buktikan pemuda santri Banten mampu bangkit menjadi jawara ekonomi Indonesia. Terima kasih.
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

        </main>
      </div>

      {/* MODAL CANVAS DETAIL */}
      {selectedCanvas && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-100 transition-transform">
            <div className="bg-slate-900 p-4 flex justify-between items-center text-white">
              <div className="flex items-center gap-3">
                <span className="text-2xl">{selectedCanvas.icon}</span>
                <h3 className="font-bold text-lg">{selectedCanvas.title}</h3>
              </div>
              <button 
                onClick={() => setSelectedCanvas(null)}
                className="text-slate-400 hover:text-white transition-colors bg-slate-800 hover:bg-slate-700 rounded-full w-8 h-8 flex items-center justify-center"
              >
                ✕
              </button>
            </div>
            <div className="p-6">
              <ul className="space-y-4">
                {selectedCanvas.content.split('\n').map((line, idx) => (
                  <li key={idx} className="flex gap-3 text-slate-700 leading-relaxed text-sm">
                    {line.startsWith('•') ? (
                      <>
                        <span className="text-amber-500 font-bold mt-0.5">•</span>
                        <span>{line.substring(2)}</span>
                      </>
                    ) : (
                      line
                    )}
                  </li>
                ))}
              </ul>
              <div className="mt-8 pt-4 border-t border-slate-100 flex justify-end">
                <button 
                  onClick={() => setSelectedCanvas(null)}
                  className="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 px-6 rounded-lg transition-colors text-sm"
                >
                  Tutup
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
